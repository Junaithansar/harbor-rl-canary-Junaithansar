name: Harbor Gemini Trials
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harbor-trials.yml'
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check API credential availability
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret missing"; exit 1; fi
      - name: Install uv and Harbor
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install harbor
      - name: Confirm Harbor CLI
        run: harbor --help
      - name: Run baseline trials
        run: |
          mkdir -p jobs_summary/baseline
          harbor run -p ./tasks/reconcile-bug -a terminus-2 --model gemini/gemini-3.8-flash -k 3 -n 1 --jobs-dir jobs_summary/baseline
      - name: Fail if baseline has trial exceptions
        run: |
          python3 - <<'PY'
          import json, glob, sys
          paths = glob.glob('jobs_summary/baseline/**/result.json', recursive=True)
          if not paths:
              sys.exit('No Harbor result.json produced')
          for path in paths:
              data = json.load(open(path))
              print('Harbor results:', json.dumps(data, indent=2)[:6000])
              if 'exceptions' in str(data).lower() and ('NotFoundError' in str(data) or 'RateLimitError' in str(data)):
                  sys.exit('Harbor agent exceptions detected; trials are not valid')
          PY
      - name: Upload raw baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-baseline-raw
          path: |
            jobs_summary/
            jobs/
          if-no-files-found: warn
