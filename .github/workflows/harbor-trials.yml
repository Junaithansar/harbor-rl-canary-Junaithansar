name: Harbor Gemini Trials
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harbor-trials.yml'
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check API credential availability
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret missing"; exit 1; fi
      - name: Install uv and Harbor
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install harbor
      - name: Confirm Harbor CLI
        run: harbor --help
      - name: Run baseline trials
        run: |
          mkdir -p jobs_summary/baseline
          harbor run -p ./tasks/reconcile-bug -a terminus-2 --model gemini/gemini-3.8-flash -k 3 -n 1 --agent-timeout-multiplier 4 --jobs-dir jobs_summary/baseline
      - name: Verify three successful baseline trials
        run: |
          python3 - <<'PY'
          import json, glob, sys
          paths = glob.glob('jobs_summary/baseline/**/result.json', recursive=True)
          trials = []
          for path in paths:
              obj = json.load(open(path))
              if isinstance(obj, dict) and 'trial_name' in obj and 'agent_result' in obj:
                  trials.append((path, obj))
          print('Trial result files:', len(trials))
          for path, data in trials:
              err = data.get('exception_info')
              reward = (data.get('verifier_result') or {}).get('rewards')
              print(path, 'exception=', (err or {}).get('exception_type'), 'reward=', reward)
          if len(trials) != 3:
              sys.exit('Expected exactly three trial result files')
          if any(data.get('exception_info') for _, data in trials):
              sys.exit('Agent exception detected; baseline not valid')
          if any(not isinstance((data.get('verifier_result') or {}).get('rewards'), dict) for _, data in trials):
              sys.exit('Missing verifier rewards')
          PY
      - name: Upload raw baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-baseline-raw
          path: |
            jobs_summary/
            jobs/
          if-no-files-found: warn
